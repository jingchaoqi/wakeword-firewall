# ⚠️ 这个文件要放到 .github/workflows/build.yml 才会生效。
#    放在这里是因为创建 workflow 需要 GitHub token 的 workflow 权限，
#    协助提交它的会话没有。你从自己机器上装上即可：
#
#        mkdir -p .github/workflows
#        cp build/github-actions-build.yml .github/workflows/build.yml
#        git add .github/workflows/build.yml && git commit -m "加 CI 构建" && git push
#
#    或者在 GitHub 网页上 Add file → Create new file，路径填
#    .github/workflows/build.yml，把下面内容粘进去。

name: 构建扩展包

# 为什么要有这个：仓库不带那 25MB 的 wasm 引擎（官方没发布 KWS 的浏览器版，
# 必须自己编），本地编一次要 20–40 分钟。让 CI 编，用户直接下 Release 里的 zip。
on:
  push:
    tags: ['v*']            # 打 tag 就发 Release
  workflow_dispatch:        # 也可以手动点一次，产物挂在 Actions 里
  pull_request:
    paths:                  # 只有动到构建链才在 PR 上跑，别浪费 40 分钟
      - 'extension/vendor/build-wasm.sh'
      - 'extension/tools/**'
      - 'build/**'
      - '.github/workflows/build.yml'

# 默认的 GITHUB_TOKEN 从 2023 年起是只读的，不写这段，打 tag 时
# softprops/action-gh-release 会以 403 收场——前面 40 分钟全白编。
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90     # 冷缓存时编译本身约 20–40 分钟，留足余量

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 装系统依赖
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build zip

      # 编译产物缓存：命中的话整个第 1 步跳过，几分钟就能出包。
      # key 里放 build-wasm.sh 的哈希——脚本改了（换 emsdk 版本、换模型）就重编。
      - name: 缓存 emsdk 与 sherpa 构建
        id: cache-build
        uses: actions/cache@v4
        with:
          path: ~/ww-build
          key: ww-build-${{ runner.os }}-${{ hashFiles('extension/vendor/build-wasm.sh') }}

      # 版本号只有一个来源：extension/manifest.json。打 tag 发版时它必须和 tag
      # 对得上——否则 Release 标题写 v0.2.0，挂的文件却叫 …-0.1.0.zip，装进
      # 浏览器显示 0.1.0，而整条流水线一声不吭。宁可在这里红掉。
      - name: 取版本号（发版时校验与 tag 一致）
        id: ver
        run: |
          V=$(python3 -c "import json;print(json.load(open('extension/manifest.json'))['version'])")
          echo "v=$V" >> "$GITHUB_OUTPUT"
          echo "manifest 版本：$V"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            T="${GITHUB_REF_NAME#v}"
            if [ "$T" != "$V" ]; then
              echo "!! tag 是 ${GITHUB_REF_NAME}（→ $T），manifest 里是 $V，对不上。"
              echo "   改 extension/manifest.json 的 version，或者换个 tag。"
              exit 1
            fi
            echo "tag 与 manifest 一致 ✓"
          fi

      - name: 编引擎 / 取模型 / 打包
        run: |
          chmod +x extension/tools/*.sh extension/vendor/*.sh
          ./extension/tools/build-all.sh

      # 全套测试。e2e 那条是唯一能证明"包装上去真的会静音"的检查，
      # 所以它必须能挂。之前它写着 continue-on-error，而测试里的 Chrome 路径
      # 又是写死的开发容器路径——等于在 CI 上必挂且永远不报。一起修掉了。
      - name: 跑测试（单测 + 端到端 + 引导页）
        working-directory: extension
        run: |
          npm install
          npx playwright install --with-deps chromium
          npm test

      - name: 记录产物信息
        run: |
          ls -lh dist/
          echo "--- 包里有没有引擎 ---"
          unzip -l dist/*.zip | grep -E 'sherpa-onnx-wasm\.wasm' \
            || { echo "!! 引擎不在包里"; exit 1; }
          unzip -l dist/*.zip | grep -E 'assets/selftest\.wav' \
            || { echo "!! 自检素材不在包里"; exit 1; }
          # 私钥绝不能进产物。pack.sh 现在没有密钥时会跳过 crx 而不是新造一把，
          # 但这道闸留着：dist/ 一旦冒出 .pem，宁可让整个构建红掉。
          if ls dist/*.pem >/dev/null 2>&1; then
            echo "!! dist/ 里有私钥，拒绝继续"; ls -l dist/*.pem; exit 1
          fi

      # 传解包后的目录，不传 zip。
      #
      # actions/upload-artifact **总会**把上传内容再打成一个 zip（名字取自
      # 下面的 name）。传 zip 进去就成了 zip 套 zip：下载后要解两次才拿得到
      # 能加载的目录。传目录则只需解一次，解出来就是 manifest.json 那一层，
      # 直接「加载已解压」即可。
      #
      # 想要用于上传应用商店的那个 .zip，走 Release（打 tag），那条路是直接
      # 上传文件、不套壳。
      - name: 摊开成可直接加载的目录
        run: |
          mkdir -p dist/unpacked
          unzip -q dist/*.zip -d dist/unpacked
          test -f dist/unpacked/manifest.json   # 解出来第一层就该是 manifest

      - uses: actions/upload-artifact@v4
        with:
          name: wakeword-firewall-${{ steps.ver.outputs.v }}-${{ github.sha }}
          path: dist/unpacked
          retention-days: 30

      - name: 打了 tag 就发 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          body: |
            解压后在 `chrome://extensions` 开启开发者模式，点「加载已解压的扩展程序」，
            选解压出来的目录即可。**引擎已内置，不用自己编。**

            装完会自动弹引导页，跟着走完自检就能用。
            已知边界（DRM 内容、杜比音轨、移动端等）见 README。
