<meta charset="utf-8">
<style>
 /* 颜色统一走 theme.js 写在 :root 上的 --ww-* 变量，兜底值就是默认外观。
    悬浮提示条用的是同一套（见 ui.css），所以两处永远一致。 */
 :root{--ink:var(--ww-fg,#E9E7E2);--dim:var(--ww-dim,#8E9199);
       --line:var(--ww-line,rgba(255,255,255,.14));--sig:var(--ww-accent,#5CBDB5);
       --warn:var(--ww-warn,#E28762)}
 /* 背景挂在 html 上、透明度挂在 body 上：Chrome 的 popup 不可能透到桌面，
    所以这里的「透明度」是内容向背景色淡入，跟提示条淡入到视频画面同理。 */
 html{background:var(--ww-bg,#16181C)}
 body{width:300px;margin:0;padding:16px;background:transparent;color:var(--ink);
      opacity:var(--ww-op,1);
      font:13px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",sans-serif}
 h1{font-size:14px;margin:0 0 3px}
 .sub{color:var(--dim);font-size:11.5px;margin:0 0 14px}
 .row{display:flex;justify-content:space-between;padding:7px 0;border-top:1px solid var(--line)}
 .n{font-variant-numeric:tabular-nums;color:var(--sig);font-weight:600}
 h2{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);
    font-weight:600;margin:16px 0 6px;padding-top:12px;border-top:1px solid var(--line)}
 label.sw{display:flex;align-items:center;gap:8px;cursor:pointer;margin:10px 0}
 .slider{display:flex;align-items:center;gap:10px;margin:6px 0 4px}
 input[type=range]{flex:1;accent-color:var(--sig)}
 .val{font-variant-numeric:tabular-nums;color:var(--sig);font-weight:700;
      min-width:46px;text-align:right;font-size:13px}
 .hint{color:var(--dim);font-size:11.5px;line-height:1.55;margin:2px 0 0}
 .hint b{color:var(--warn);font-weight:600}
 .presets{display:flex;gap:6px;margin:8px 0 0}
 .presets button{flex:1;padding:5px 0;border:1px solid var(--line);border-radius:4px;
   background:var(--ww-btn,rgba(255,255,255,.08));color:var(--dim);font-size:11px;cursor:pointer}
 .presets button:hover{border-color:var(--sig);color:var(--sig)}
 .presets button.on{background:var(--ww-btn-hover,rgba(255,255,255,.16));border-color:var(--sig);color:var(--sig);font-weight:600}
 textarea{width:100%;height:76px;margin-top:6px;background:var(--ww-btn,rgba(255,255,255,.08));color:var(--ink);
   border:1px solid var(--line);border-radius:4px;padding:8px;
   font:11px/1.5 ui-monospace,monospace;resize:vertical;box-sizing:border-box}
 button.save{margin-top:8px;width:100%;padding:7px;border:0;border-radius:4px;
   background:#1C6A66;color:#fff;font-weight:600;cursor:pointer}
 .foot{margin-top:14px;padding-top:10px;border-top:1px solid var(--line);
   display:flex;justify-content:space-between;align-items:center}
 .link{color:var(--sig);font-size:11.5px;cursor:pointer;text-decoration:none}
 .link:hover{text-decoration:underline}
 .notice{display:none;margin:8px 0 0;padding:8px 10px;border-radius:4px;
   background:#33211A;border:1px solid var(--warn);color:var(--ink);font-size:11.5px}
 .notice.on{display:flex;align-items:center;gap:8px;justify-content:space-between}
 .notice button{all:unset;cursor:pointer;padding:3px 10px;border-radius:4px;
   background:var(--warn);color:#16181C;font-size:11px;font-weight:700;flex:none}
 .add{display:flex;gap:6px;margin:6px 0 0}
 .add input{flex:1;background:var(--ww-btn,rgba(255,255,255,.08));color:var(--ink);border:1px solid var(--line);
   border-radius:4px;padding:6px 8px;font:13px inherit;box-sizing:border-box}
 .add input:focus{outline:0;border-color:var(--sig)}
 .add button{flex:none;padding:0 14px;border:0;border-radius:4px;background:#1C6A66;
   color:#fff;font-size:12px;font-weight:600;cursor:pointer}
 .add button:disabled{background:#2A2E33;color:var(--dim);cursor:default}
 .addmsg{font-size:11.5px;margin:6px 0 0;line-height:1.5;min-height:1em}
 .addmsg.ok{color:var(--sig)} .addmsg.bad{color:var(--warn)}
 .skin{display:flex;align-items:center;gap:10px;margin:8px 0 0}
 .pick{display:flex;align-items:center;gap:7px;color:var(--dim);font-size:12px;
   cursor:pointer;flex:1}
 /* background:none 会让 Chrome 不画原生色块，控件看着永远是白的（值其实是对的）。
    正确做法是关掉默认外观，再单独给 ::-webkit-color-swatch 上样式。 */
 .pick input[type=color]{-webkit-appearance:none;appearance:none;
   width:34px;height:22px;padding:0;border:none;background:none;cursor:pointer}
 .pick input[type=color]::-webkit-color-swatch-wrapper{padding:0}
 .pick input[type=color]::-webkit-color-swatch{
   border:1px solid var(--line);border-radius:4px}
 #skinreset{all:unset;cursor:pointer;padding:4px 10px;border-radius:4px;
   border:1px solid var(--line);color:var(--dim);font-size:11px;flex:none}
 #skinreset:hover{border-color:var(--sig);color:var(--sig)}
 .words{margin:2px 0 0}
 .w{display:flex;justify-content:space-between;align-items:baseline;padding:3px 0;
    font-size:12px}
 .w .k{color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .w .v{font-variant-numeric:tabular-nums;color:var(--sig);font-weight:600;
       flex:none;margin-left:10px}
 .w.hist .v{color:var(--dim)}
 .none{color:var(--dim);font-size:11.5px;margin:3px 0 0}
 .blind{margin:8px 0 0;padding:7px 9px;border-radius:4px;background:#33211A;
   border:1px solid var(--warn);font-size:11.5px;display:none}
 .blind.on{display:block}
 .tabs{display:flex;gap:14px;margin:14px 0 0;border-bottom:1px solid var(--line)}
 .tabs button{all:unset;cursor:pointer;padding:0 0 6px;font-size:11px;
   letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600;
   border-bottom:2px solid transparent;margin-bottom:-1px}
 .tabs button.on{color:var(--sig);border-bottom-color:var(--sig)}
 .addmsg code{font:11px ui-monospace,monospace;color:var(--dim)}
</style>

<h1>唤醒词防火墙</h1>
<p class="sub">全程本地推理，不发一个网络请求</p>

<div class="blind" id="blindnote"></div>

<div class="tabs">
  <button id="tabpage" class="on">本页屏蔽统计</button>
  <button id="tabhist">历史屏蔽统计</button>
</div>
<div class="words" id="words"></div>

<label class="sw"><input type="checkbox" id="on" checked> 启用防护</label>
<div class="notice" id="reload">
  <span id="reloadtext"></span><button id="doreload">刷新页面</button>
</div>
<label class="sw"><input type="checkbox" id="banner" checked> 拦截时显示悬浮提示</label>
<p class="hint" id="bannerhint"></p>

<label class="sw"><input type="checkbox" id="blind"> 当前页不支持拦截唤醒词时显示悬浮提示</label>
<p class="hint">无论悬浮提示是否开启，工具栏图标角上都会出现 <b><code>!</code></b> 标记当前页不支持。</p>

<h2>静音时长</h2>
<div class="slider">
  <input type="range" id="tail" min="0" max="8" step="0.1" value="0.3">
  <span class="val" id="tailv">0.3s</span>
</div>
<div class="presets">
  <button data-v="0.3">仅唤醒词</button>
  <button data-v="2">短指令</button>
  <button data-v="4">整句指令</button>
</div>
<p class="hint" id="tailhint"></p>

<h2>外观</h2>
<div class="slider">
  <input type="range" id="op" min="0.3" max="1" step="0.05">
  <span class="val" id="opv">95%</span>
</div>
<div class="skin">
  <label class="pick">背景色
    <input type="color" id="bg">
  </label>
  <button id="skinreset">恢复默认</button>
</div>
<p class="hint">提示条和这个面板共用一套。文字颜色按背景亮度自动挑，不会调出看不清的配色。</p>

<h2>唤醒词表</h2>
<div class="add">
  <input id="addword" placeholder="输入中文，如：小爱同学" maxlength="12">
  <button id="addbtn">添加</button>
</div>
<p class="addmsg" id="addmsg"></p>
<textarea id="kw" spellcheck="false" placeholder="每行一个唤醒词"></textarea>
<button class="save" id="save">保存词表</button>

<div class="foot">
  <a class="link" id="guide">安装引导 / 自检</a>
</div>

<script src="theme.js"></script>
<script src="pinyin-data.js"></script>
<script src="text2token.js"></script>
<script src="popup.js"></script>
